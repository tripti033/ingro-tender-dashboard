name: BESS Tender Scraper

on:
  schedule:
    # Run every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_SCRAPER_EMAIL: ${{ secrets.FIREBASE_SCRAPER_EMAIL }}
      FIREBASE_SCRAPER_PASSWORD: ${{ secrets.FIREBASE_SCRAPER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run BESS tender scraper
        run: node scraper/index.js

      - name: Generate company merge suggestions
        run: node scraper/suggest-merges.js
        continue-on-error: true

      # The public site caches the tender list for an hour to keep Firestore
      # reads flat under crawler traffic. This tells it to drop that cache now,
      # so a tender scraped above is live within seconds instead of up to an
      # hour later. Never fails the run: the scrape itself already succeeded,
      # and without this the site still refreshes on its own schedule.
      - name: Refresh the public site
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://tenders.ingroenergy.com
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET is not set — skipping."
            echo "The site will still pick up new tenders within the hour."
            exit 0
          fi
          # No trailing command after this: curl's exit code must be the
          # step's, or a failed refresh would still report green.
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            "$SITE_URL/api/revalidate"
